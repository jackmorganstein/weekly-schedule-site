<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Weekly Schedule Planner</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }

      .login-shell {
        width: min(420px, 100%);
        background: white;
        border: 1px solid #dfe7ff;
        border-radius: 22px;
        box-shadow: 0 12px 30px rgba(79, 70, 229, 0.12);
        padding: 28px;
      }

      .login-shell h1 {
        margin-bottom: 8px;
      }

      .login-subtitle {
        margin-bottom: 22px;
        color: #667085;
      }

      .login-form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .login-form label {
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-weight: 700;
      }

      .login-form input {
        width: 100%;
        border: 1px solid #d0d9f3;
        background: #f9fbff;
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 1rem;
      }

      .login-form button {
        background: linear-gradient(135deg, #4f46e5 0%, #6d5ef7 100%);
        color: white;
        border: none;
        border-radius: 12px;
        padding: 12px 18px;
        font-weight: 700;
        cursor: pointer;
      }

      .login-error {
        min-height: 20px;
        color: #d92d20;
        font-size: 0.9rem;
        font-weight: 600;
      }

      @media (max-width: 480px) {
        .login-shell {
          padding: 22px 18px;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-shell">
      <p class="eyebrow">Planner</p>
      <h1>Log in</h1>
      <p class="login-subtitle">Access your weekly schedule</p>

      <form class="login-form" id="loginForm">
        <label>
          Username
          <input id="username" type="text" placeholder="Enter username" required />
        </label>

        <label>
          Password
          <input id="password" type="password" placeholder="Enter password" required />
        </label>

        <div id="loginError" class="login-error" aria-live="polite"></div>
        <button type="submit">Log in</button>
      </form>
    </div>

    <script>
      async function hashString(value) {
        const encoder = new TextEncoder();
        const data = encoder.encode(value);
        const hashBuffer = await crypto.subtle.digest("SHA-256", data);

        return Array.from(new Uint8Array(hashBuffer))
          .map((byte) => byte.toString(16).padStart(2, "0"))
          .join("");
      }

      async function initializeLogin() {
        const validUsername = "jackmorganstein";
        const validPassword = "Charlie";
        const validUsernameHash = await hashString(validUsername);
        const validPasswordHash = await hashString(validPassword);

        const loginForm = document.getElementById("loginForm");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const loginError = document.getElementById("loginError");

        loginForm.addEventListener("submit", async function (event) {
          event.preventDefault();

          const username = usernameInput.value.trim();
          const password = passwordInput.value.trim();
          const usernameHash = await hashString(username);
          const passwordHash = await hashString(password);

          if (usernameHash === validUsernameHash && passwordHash === validPasswordHash) {
            localStorage.setItem("weeklyScheduleLoggedIn", "true");
            localStorage.setItem("weeklyScheduleUsernameHash", usernameHash);
            localStorage.setItem("weeklySchedulePasswordHash", passwordHash);
            window.location.href = "index.html";
            return;
          }

          loginError.textContent = "Incorrect username or password.";
          usernameInput.value = "";
          passwordInput.value = "";
        });

        if (localStorage.getItem("weeklyScheduleLoggedIn") === "true") {
          const storedUsernameHash = localStorage.getItem("weeklyScheduleUsernameHash");
          const storedPasswordHash = localStorage.getItem("weeklySchedulePasswordHash");

          if (storedUsernameHash === validUsernameHash && storedPasswordHash === validPasswordHash) {
            window.location.href = "index.html";
          } else {
            localStorage.removeItem("weeklyScheduleLoggedIn");
          }
        }
      }

      initializeLogin();
    </script>
  </body>
</html>
